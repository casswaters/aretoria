<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <meta name="description" content="Aretoria: the Seven Realms. Step through the portal, meet Irishnu the Guide, and walk the Axial hub." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aretoria" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <title>Aretoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" />
  <link rel="stylesheet" href="shell.css?v=18" />
  <!-- First paint = the entrance's night background (no landing-card flash) unless ?land=1 -->
  <script>if (!/[?&]land=1(&|$)/.test(location.search)) document.documentElement.classList.add('ar-autoenter');</script>
  <style>html.ar-autoenter, html.ar-autoenter body { background: #020108; } html.ar-autoenter #landing { display: none; }</style>
  <link rel="preload" as="image" href="assets/aretoria/mobile/shrine.jpg" media="(max-width: 699px)" />
  <link rel="preload" as="image" href="assets/aretoria/shrine.jpg" media="(min-width: 700px)" />
</head>
<body>
  <main id="landing" class="landing" aria-label="Aretoria entry">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="landing-veil" aria-hidden="true"></div>
    <div class="landing-card">
      <div class="landing-mark" aria-hidden="true">✦</div>
      <h1>Aretoria</h1>
      <p class="landing-sub">The Seven Realms</p>
      <p class="landing-blurb">
        Step through the portal to the Axial hub, where <span class="guide-name">Irishnu</span> the Guide meets you
        at the center. Courage, Justice, Humanity, Temperance, Wisdom, Transcendence,
        and Shadow, each with its warrior Guardian. Scripted advisors. No server.
      </p>
      <button type="button" class="enter-btn" id="enter-btn">Enter the Realms</button>
      <p class="landing-foot">
        Also linked from
        <a href="https://casswaters.github.io/modern-era-calendar/">Captain’s Log</a>
      </p>
    </div>
  </main>
  <script type="module" src="boot.js?v=43"></script>
</body>
</html>
